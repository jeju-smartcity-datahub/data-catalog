name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run install:apps
      - run: npm run typecheck
      - run: npm run test:ui:unit
      - run: npm run lint
      - run: docker pull postgres:17.11-bookworm
      - run: bash server/mvnw -f server/pom.xml --batch-mode verify
      - run: npm run build:web && npm run build:admin
